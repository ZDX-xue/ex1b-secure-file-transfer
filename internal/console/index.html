<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>服务端管理 · 安全文件传输</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="/"><span class="brand-icon" aria-hidden="true">⇄</span>安全文件传输</a>
      <span class="local">本机管理页</span>
    </div>
  </header>
  <main>
    <div class="heading">
      <div><h1>服务端管理</h1><p id="address">正在读取监听地址…</p></div>
      <button id="admission" disabled>暂停新连接</button>
    </div>
    <p id="notice" class="warning" role="status" hidden></p>
    <section class="stats" aria-label="服务状态">
      <div><span>连接接入</span><strong id="accepting">—</strong></div>
      <div><span>已验证会话</span><strong id="sessions-count">—</strong></div>
      <div><span>已登记账号</span><strong id="accounts-count">—</strong></div>
      <div><span>传输保护</span><strong class="tls">双向 TLS 1.3</strong></div>
    </section>
    <div class="grid">
      <section class="card">
        <div class="card-head"><h2>当前会话</h2><p>实时累计的文件数据与请求次数</p></div>
        <div class="wrap">
          <table><thead><tr><th>会话</th><th>账号</th><th>客户端</th><th>接收</th><th>发送</th><th>请求</th></tr></thead><tbody id="sessions"></tbody></table>
          <p class="empty" id="sessions-empty">暂无已验证的连接。</p>
        </div>
      </section>
      <section class="card">
        <div class="card-head"><h2>账号与带宽</h2><p>每个账号使用独立存储空间</p></div>
        <div id="users" class="users"></div>
      </section>
    </div>
    <section class="card audit">
      <div class="card-head audit-head"><div><h2>操作记录</h2><p>最近的连接、文件校验和传输结果</p></div><button class="secondary" id="refresh">刷新</button></div>
      <div class="wrap">
        <table><thead><tr><th>时间</th><th>账号</th><th>会话</th><th>操作</th><th>文件</th><th>结果</th></tr></thead><tbody id="events"></tbody></table>
        <p class="empty" id="events-empty">等待客户端操作。</p>
      </div>
    </section>
  </main>
</body>
</html>
